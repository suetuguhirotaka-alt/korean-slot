<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>韓国語作文スロット Master</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --gold: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --slot-bg: #0f172a;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      text-align: center;
      padding: 4px 0;
    }

    h1 {
      font-size: 1.35rem;
      color: var(--accent-color);
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.75rem;
    }

    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 8px;
    }

    .level-btn {
      background: #334155;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      padding: 4px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .level-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .slot-machine {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
    }

    .reels-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    @media (max-width: 640px) {
      .reels-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .reel-box {
      background: var(--slot-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .reel-box.active {
      border-color: var(--accent-color);
    }

    .reel-box.locked {
      border-color: var(--gold);
    }

    .reel-header {
      background: #1e293b;
      color: var(--text-sub);
      font-size: 0.7rem;
      text-align: center;
      padding: 4px 2px;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
    }

    .reel-viewport {
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px;
      position: relative;
    }

    .word-kr {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .word-jp {
      font-size: 0.68rem;
      color: var(--text-sub);
    }

    .action-panel {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    .btn {
      background: #334155;
      color: var(--text-main);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      max-width: 170px;
    }

    .btn-primary { background: #0284c7; color: #fff; }
    .btn-stop { background: #e11d48; color: #fff; }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result-card {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .sentence-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .sentence-kr {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      margin: 2px 0;
    }

    .sentence-jp {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .audio-btn {
      background: #0284c7;
      border: none;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      margin-left: 6px;
      vertical-align: middle;
    }

    .grammar-note {
      font-size: 0.75rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
    }
    /* iPhone 12 / mobile Safari */
    html { -webkit-text-size-adjust: 100%; }
    body { min-height: 100vh; min-height: 100dvh; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .word-kr, .word-jp, .sentence-kr, .sentence-jp { overflow-wrap: anywhere; }
    .reel-box { min-width: 0; }
    .level-btn { min-height: 44px; padding: 8px 10px; }
    .btn { min-height: 52px; }
    .audio-btn { width: 44px; height: 44px; }
    @media (max-width: 480px) {
      .container { gap: 12px; }
      .top-bar { flex-wrap: wrap; gap: 6px; }
      .top-bar > span { width: 100%; text-align: center; }
      .level-btn { flex: 1; font-size: .72rem; }
      .slot-machine { padding: 9px; }
      .reels-container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .reel-viewport { min-height: 96px; height: auto; }
      .word-kr { font-size: 1rem; line-height: 1.35; }
      .word-jp { font-size: .75rem; line-height: 1.4; }
      .action-panel { gap: 8px; }
      .btn { padding: 12px 8px; font-size: .85rem; }
      .sentence-kr { font-size: 1.1rem; line-height: 1.6; }
      .sentence-jp { line-height: 1.6; }
    }
  </style>
</head>

<div class="container">
  <header>
    <h1>🎰 韓国語作文スロット Master</h1>
    <p class="subtitle">動詞150超・大規模語彙・修復安定化モデル</p>
  </header>

  <div class="top-bar">
    <span style="font-size:0.75rem; color:var(--text-sub);">難易度:</span>
    <button class="level-btn active" id="btn-topik3" onclick="setLevel('topik3')">TOPIK 3級 (-기로 하다)</button>
    <button class="level-btn" id="btn-topik4" onclick="setLevel('topik4')">TOPIK 4級 (-아/어야 되다)</button>
  </div>

  <div class="slot-machine">
    <div class="reels-container">
      <div class="reel-box" id="reel-box-0">
        <div class="reel-header">① 主語 (주어)</div>
        <div class="reel-viewport">
          <div class="word-kr" id="reel-kr-0">저는</div>
          <div class="word-jp" id="reel-jp-0">私は</div>
        </div>
      </div>

      <div class="reel-box" id="reel-box-1">
        <div class="reel-header">② いつ・副詞 (때/부사)</div>
        <div class="reel-viewport">
          <div class="word-kr" id="reel-kr-1">오늘</div>
          <div class="word-jp" id="reel-jp-1">今日</div>
        </div>
      </div>

      <div class="reel-box" id="reel-box-2">
        <div class="reel-header">③ 目的語/対象 (목적어)</div>
        <div class="reel-viewport">
          <div class="word-kr" id="reel-kr-2">여권을</div>
          <div class="word-jp" id="reel-jp-2">パスポートを</div>
        </div>
      </div>

      <div class="reel-box" id="reel-box-3">
        <div class="reel-header">④ 動詞・表現 (동사)</div>
        <div class="reel-viewport">
          <div class="word-kr" id="reel-kr-3">확인하기로 했어요</div>
          <div class="word-jp" id="reel-jp-3">確認することにしました</div>
        </div>
      </div>
    </div>

    <div class="action-panel">
      <button class="btn btn-primary" id="start-btn" onclick="startSlot()">スタート (A)</button>
      <button class="btn btn-stop" id="stop-btn" onclick="stopNextReel()" disabled>ストップ (Space)</button>
    </div>
  </div>

  <div class="result-card" id="result-card">
    <div style="font-size:0.8rem; color:var(--gold); font-weight:bold;">✨ 完成した文章</div>
    <div class="sentence-box">
      <div class="sentence-kr">
        <span id="final-kr-text"></span>
        <button class="audio-btn" onclick="speakSentence()" title="音声再生">🔊</button>
      </div>
      <div class="sentence-jp" id="final-jp-text"></div>
    </div>
    <div class="grammar-note" id="grammar-note"></div>
  </div>
</div>

  { basic: "새겨두다", jp: "刻んでおく" }, { basic: "소리치다", jp: "叫ぶ" }, { basic: "지켜보다", jp: "見守る" },
  { basic: "마주하다", jp: "向き合う" }, { basic: "다다르다", jp: "たどり着く" }, { basic: "펼쳐지다", jp: "広がる" },
  { basic: "깨뜨리다", jp: "打ち破る" }, { basic: "이끌다", jp: "導く" }, { basic: "돋보이다", jp: "ひときわ目立つ" }
];

function buildVerbs(level) {
  return rawVerbs.map(function(v) {
    var stem = v.basic.replace(/다$/, '');
    if (level === 'topik3') {
      return {
        kr: v.basic,
        pattern: stem + "기로 했어요",
        jpPattern: v.jp + "ことにしました",
        note: "TOPIK 3級文法【-기로 하다（〜することにする）】"
      };
    } else {
      var conjugatedStem = stem;
      if (stem.endsWith('하')) {
        conjugatedStem = stem.replace(/하$/, '해');
      } else {
        if (['오', '가', '보', '내'].some(function(x) { return stem.endsWith(x); })) {
          conjugatedStem = stem + '야';
        } else {
          conjugatedStem = stem + '어야';
        }
      }
      return {
        kr: v.basic,
        pattern: conjugatedStem + " 돼요",
        jpPattern: v.jp + "なければなりません",
        note: "TOPIK 4級文法【-아/어야 되다（〜しなければならない）】"
      };
    }
  });
}

function startSlot() {
  if (isSpinning) return;
  isSpinning = true;
  currentStep = 0;
  
  var resCard = document.getElementById('result-card');
  if (resCard) resCard.style.display = 'none';

  document.getElementById('start-btn').disabled = true;
  document.getElementById('stop-btn').disabled = false;

  var currentVerbs = buildVerbs(currentLevel);

  var boxes = document.querySelectorAll('.reel-box');
  for (var i = 0; i < boxes.length; i++) {
    boxes[i].className = 'reel-box';
  }
  document.getElementById('reel-box-0').className = 'reel-box active';

  selectedIndices = [0, 0, 0, 0];
  spinIntervals[0] = setInterval(function() { spinReel(0, subjects); }, 50);
  spinIntervals[1] = setInterval(function() { spinReel(1, timeMeans); }, 60);
  spinIntervals[2] = setInterval(function() { spinReel(2, targets); }, 55);
  spinIntervals[3] = setInterval(function() { spinReel(3, currentVerbs); }, 50);
}

function spinReel(index, array) {
  if (!array || array.length === 0) return;
  var randIdx = Math.floor(Math.random() * array.length);
  selectedIndices[index] = randIdx;
  
  var item = array[randIdx];
  var krElem = document.getElementById('reel-kr-' + index);
  var jpElem = document.getElementById('reel-jp-' + index);

  if (index === 3) {
    krElem.textContent = item.pattern || item.kr || "";
    jpElem.textContent = item.jpPattern || item.jp || "";
  } else {
    krElem.textContent = item.kr || "";
    jpElem.textContent = item.jp || "";
  }
}

function stopNextReel() {
  if (!isSpinning) return;
  clearInterval(spinIntervals[currentStep]);
  document.getElementById('reel-box-' + currentStep).className = 'reel-box locked';

  currentStep++;
  if (currentStep < 4) {
    document.getElementById('reel-box-' + currentStep).className = 'reel-box active';
  } else {
    finishSlot();
  }
}

function finishSlot() {
  isSpinning = false;
  document.getElementById('start-btn').disabled = false;
  document.getElementById('stop-btn').disabled = true;

  var currentVerbs = buildVerbs(currentLevel);

  var subj = subjects[selectedIndices[0]] || subjects[0];
  var time = timeMeans[selectedIndices[1]] || timeMeans[0];
  var target = targets[selectedIndices[2]] || targets[0];
  var verb = currentVerbs[selectedIndices[3]] || currentVerbs[0];

  var particle = "";
  if (target.particleOverride) {
    particle = target.particleOverride;
  } else {
    var lastChar = target.kr.charCodeAt(target.kr.length - 1);
    var hasBatchim = (lastChar >= 0xac00 && lastChar <= 0xd7a3) ? ((lastChar - 0xac00) % 28 !== 0) : false;
    particle = hasBatchim ? "을" : "를";
  }

  document.getElementById('final-kr-text').textContent = subj.kr + " " + time.kr + " " + target.kr + particle + " " + verb.pattern + ".";
  document.getElementById('final-jp-text').textContent = subj.jp + " " + time.jp + " " + target.jp + " " + verb.jpPattern + "。";
  document.getElementById('grammar-note').textContent = "💡 文法解説: " + verb.note;
  document.getElementById('result-card').style.display = 'flex';
}

function setLevel(lvl) {
  if (isSpinning) return;
  currentLevel = lvl;
  document.getElementById('btn-topik3').className = lvl === 'topik3' ? 'level-btn active' : 'level-btn';
  document.getElementById('btn-topik4').className = lvl === 'topik4' ? 'level-btn active' : 'level-btn';
}

function speakSentence() {
  var text = document.getElementById('final-kr-text').textContent;
  if ('speechSynthesis' in window) {
    var utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }
}

window.onkeydown = function(e) {
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  var key = e.key ? e.key.toLowerCase() : '';
  if (key === 'a' || key === 'ㅁ') {
    if (!isSpinning) startSlot();
  } else if (e.code === 'Space' || key === ' ') {
    e.preventDefault();
    if (isSpinning) {
      stopNextReel();
    }
  }
};
</script>
