<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓国語作文スロット Master v2</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --gold: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --slot-bg: #0f172a;
      --border-color: #334155;
      --hanja-bg: rgba(56, 189, 248, 0.15);
      --hanja-text: #7dd3fc;
      --native-bg: rgba(52, 211, 153, 0.15);
      --native-text: #6ee7b7;
      --loan-bg: rgba(192, 132, 252, 0.15);
      --loan-text: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      text-align: center;
      padding: 4px 0;
    }

    h1 {
      font-size: 1.35rem;
      color: var(--accent-color);
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.75rem;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 8px;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--border-color);
      margin: 0 4px;
    }

    .level-btn, .toggle-btn {
      background: #334155;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
    }

    .level-btn.active {
      background: var(--accent-color);
      color: #0f172a;
      border-color: var(--accent-color);
    }

    .toggle-btn.active {
      background: #0f766e;
      color: #f0fdfa;
      border-color: #14b8a6;
    }

    .slot-machine {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
    }

    .reels-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    @media (max-width: 640px) {
      .reels-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .divider {
        display: none;
      }
    }

    .reel-box {
      background: var(--slot-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .reel-box.active {
      border-color: var(--accent-color);
    }

    .reel-box.locked {
      border-color: var(--gold);
    }

    .reel-box.pinned {
      border-color: #64748b;
      background: #131c31;
    }

    .reel-header {
      background: #1e293b;
      color: var(--text-sub);
      font-size: 0.7rem;
      padding: 4px 6px;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pin-btn {
      background: transparent;
      border: 1px solid #475569;
      color: var(--text-sub);
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .pin-btn.pinned {
      background: var(--gold);
      color: #0f172a;
      border-color: var(--gold);
      font-weight: bold;
    }

    .reel-viewport {
      min-height: 92px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px 4px;
      gap: 4px;
    }

    .word-kr {
      font-size: 1.02rem;
      font-weight: bold;
      color: var(--text-main);
      line-height: 1.25;
    }

    .word-jp {
      font-size: 0.7rem;
      color: var(--text-sub);
      min-height: 1em;
    }

    .word-jp.hidden {
      visibility: hidden;
    }

    .etym-tag {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: bold;
      min-height: 16px;
    }

    .etym-hanja {
      background: var(--hanja-bg);
      color: var(--hanja-text);
    }

    .etym-native {
      background: var(--native-bg);
      color: var(--native-text);
    }

    .etym-loan {
      background: var(--loan-bg);
      color: var(--loan-text);
    }

    .etym-empty {
      visibility: hidden;
    }

    .action-panel {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    .btn {
      background: #334155;
      color: var(--text-main);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      max-width: 180px;
    }

    .btn-primary { background: #0284c7; color: #fff; }
    .btn-stop { background: #e11d48; color: #fff; }
    .btn-reveal {
      background: #334155;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      display: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result-card {
      background: var(--card-bg);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .sentence-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .sentence-kr {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      margin: 2px 0;
    }

    .sentence-jp {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .sentence-jp.hidden {
      display: none;
    }

    .audio-btn {
      background: #0284c7;
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      margin-left: 6px;
      vertical-align: middle;
    }

    .grammar-note {
      font-size: 0.75rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 5px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎰 韓国語作文スロット Master v2</h1>

  </div>

  <div class="slot-machine">
    <div class="reels-container">
      <div class="reel-box" id="reel-box-0">

          <span>① 主語</span>

          <div class="word-kr" id="reel-kr-0">저는</div>
          <div class="word-jp" id="reel-jp-0">私は</div>
        </div>
      </div>

      <div class="reel-box" id="reel-box-1">
        <div class="reel-header">
          <span>② いつ・副詞</span>
          <button type="button" class="pin-btn" id="pin-1">🔓 固定</button>
        </div>
        <div class="reel-viewport">
          <span class="etym-tag etym-native" id="reel-tag-1">固</span>
          <div class="word-kr" id="reel-kr-1">오늘</div>
          <div class="word-jp" id="reel-jp-1">今日</div>
        </div>
      </div>

      <div class="reel-box" id="reel-box-2">
        <div class="reel-header">
          <span>③ 目的語</span>
          <button type="button" class="pin-btn" id="pin-2">🔓 固定</button>
        </div>
        <div class="reel-viewport">
          <span class="etym-tag etym-hanja" id="reel-tag-2">漢 旅券</span>
          <div class="word-kr" id="reel-kr-2">여권을</div>
          <div class="word-jp" id="reel-jp-2">パスポートを</div>
        </div>
      </div>

      <div class="reel-box" id="reel-box-3">
        <div class="reel-header">
          <span>④ 動詞・表現</span>
          <button type="button" class="pin-btn" id="pin-3">🔓 固定</button>
        </div>
        <div class="reel-viewport">
          <span class="etym-tag etym-hanja" id="reel-tag-3">漢 確認</span>
          <div class="word-kr" id="reel-kr-3">확인하기로 했어요</div>
          <div class="word-jp" id="reel-jp-3">確認することにしました</div>
        </div>
      </div>
    </div>

    <div class="action-panel">
      <button type="button" class="btn btn-primary" id="start-btn">スタート (A)</button>
      <button type="button" class="btn btn-stop" id="stop-btn" disabled>ストップ (Space)</button>
    </div>
  </div>

  <div class="result-card" id="result-card">
    <div style="font-size:0.8rem; color:var(--gold); font-weight:bold;">✨ 完成した文章</div>
    <div class="sentence-box">
      <div class="sentence-kr">
        <span id="final-kr-text"></span>
        <button type="button" class="audio-btn" id="audio-btn" title="音声再生">🔊</button>
      </div>
      <div class="sentence-jp" id="final-jp-text"></div>
      <button type="button" class="btn-reveal" id="reveal-btn">和訳を見る (H)</button>
    </div>
    <div class="grammar-note" id="grammar-note"></div>
  </div>
</div>

    { basic: "내다", jp: "払う", type: "固" },
    { basic: "걸리다", jp: "かかる / ひく", type: "固" },
    { basic: "기울이다", jp: "傾ける / 払う", type: "固" },
    { basic: "지키다", jp: "守る", type: "固" },
    { basic: "멈추다", jp: "止まる", type: "固" },
    { basic: "정신을 차리다", jp: "気を引き締める", type: "漢", hanja: "精神" },
    { basic: "최선을 다하다", jp: "最善を尽くす", type: "漢", hanja: "最善" },
    { basic: "부서지다", jp: "砕け散る", type: "固" },
    { basic: "부르다", jp: "呼ぶ", type: "固" },
    { basic: "빨라지다", jp: "速くなる", type: "固" },
    { basic: "녹아내리다", jp: "溶け落ちる", type: "固" },
    { basic: "날아오르다", jp: "舞い上がる", type: "固" },
    { basic: "그리다", jp: "思い浮かべる / 描く", type: "固" },
    { basic: "비추다", jp: "照らす", type: "固" },
    { basic: "맞잡다", jp: "握り合う", type: "固" },
    { basic: "번지다", jp: "広がる", type: "固" },
    { basic: "잊지 못하다", jp: "忘れられない", type: "固" },
    { basic: "닮다", jp: "似ている", type: "固" }
  ];

  function buildVerbs(level) {
    return rawVerbs.map(function(v) {
      var stem = v.basic.replace(/다$/, '');
      if (level === 'topik3') {
        return {
          kr: v.basic,
          pattern: stem + "기로 했어요",
          jpPattern: v.jp + "ことにしました",
          type: v.type,
          hanja: v.hanja,
          note: "TOPIK 3級文法【-기로 하다（〜することにする）】"
        };
      } else {
        var conjugatedStem = stem;
        if (stem.endsWith('하')) {
          conjugatedStem = stem.replace(/하$/, '해');
        } else if (['오', '가', '보', '내'].some(function(x) { return stem.endsWith(x); })) {
          conjugatedStem = stem + '야';
        } else {
          conjugatedStem = stem + '어야';
        }
        return {
          kr: v.basic,
          pattern: conjugatedStem + " 돼요",
          jpPattern: v.jp + "なければなりません",
          type: v.type,
          hanja: v.hanja,
          note: "TOPIK 4級文法【-아/어야 되다（〜しなければならない）】"
        };
      }
    });
  }

  function renderTag(index, item) {
    var tagElem = document.getElementById('reel-tag-' + index);
    if (!item || !item.type) {
      tagElem.textContent = "";
      tagElem.className = "etym-tag etym-empty";
      return;
    }
    if (item.type === "漢") {
      tagElem.textContent = item.hanja ? ("漢 " + item.hanja) : "漢";
      tagElem.className = "etym-tag etym-hanja";
    } else if (item.type === "固") {
      tagElem.textContent = "固";
      tagElem.className = "etym-tag etym-native";
    } else {
      tagElem.textContent = "外";
      tagElem.className = "etym-tag etym-loan";
    }
  }

  function pickNonRepeatingIndex(reelIndex, array) {
    if (array.length <= 1) return 0;
    var hist = recentHistory[reelIndex];
    var candidates = [];
    for (var i = 0; i < array.length; i++) {
      if (hist.indexOf(i) === -1) candidates.push(i);
    }
    if (candidates.length === 0) {
      recentHistory[reelIndex] = [];
      return Math.floor(Math.random() * array.length);
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function recordHistory(reelIndex, chosenIdx) {
    var hist = recentHistory[reelIndex];
    hist.push(chosenIdx);
    if (hist.length > HISTORY_LIMIT) hist.shift();
  }

  function spinReel(index, array) {
    if (!array || array.length === 0) return;
    var randIdx = Math.floor(Math.random() * array.length);
    selectedIndices[index] = randIdx;
    updateReelDisplay(index, array[randIdx]);
  }

  function updateReelDisplay(index, item) {
    var krElem = document.getElementById('reel-kr-' + index);
    var jpElem = document.getElementById('reel-jp-' + index);
    renderTag(index, item);

    if (index === 3) {
      krElem.textContent = item.pattern || item.kr || "";
      jpElem.textContent = item.jpPattern || item.jp || "";
    } else {
      krElem.textContent = item.kr || "";
      jpElem.textContent = item.jp || "";
    }
  }

  function applyHideJpState() {
    for (var i = 0; i < 4; i++) {
      var el = document.getElementById('reel-jp-' + i);
      if (hideJp) el.classList.add('hidden');
      else el.classList.remove('hidden');
    }
  }

  function startSlot() {
    if (isSpinning) return;

    activeSteps = [];
    for (var i = 0; i < 4; i++) {
      if (!pinned[i]) activeSteps.push(i);
    }

    if (activeSteps.length === 0) {
      finishSlot();
      return;
    }

    isSpinning = true;
    activePos = 0;

    document.getElementById('result-card').style.display = 'none';
    document.getElementById('start-btn').disabled = true;
    document.getElementById('stop-btn').disabled = false;

    var currentVerbs = buildVerbs(currentLevel);
    var arrays = [subjects, timeMeans, targets, currentVerbs];
    var speeds = [55, 65, 60, 55];

    for (var j = 0; j < 4; j++) {
      var box = document.getElementById('reel-box-' + j);
      box.className = pinned[j] ? 'reel-box pinned' : 'reel-box';
    }

    document.getElementById('reel-box-' + activeSteps[0]).className = 'reel-box active';

    activeSteps.forEach(function(reelIdx) {
      spinIntervals[reelIdx] = setInterval(function() {
        spinReel(reelIdx, arrays[reelIdx]);
      }, speeds[reelIdx]);
    });
  }

  function stopNextReel() {
    if (!isSpinning) return;
    var reelIdx = activeSteps[activePos];
    clearInterval(spinIntervals[reelIdx]);

    var currentVerbs = buildVerbs(currentLevel);
    var arrays = [subjects, timeMeans, targets, currentVerbs];
    var finalIdx = pickNonRepeatingIndex(reelIdx, arrays[reelIdx]);
    selectedIndices[reelIdx] = finalIdx;
    recordHistory(reelIdx, finalIdx);
    updateReelDisplay(reelIdx, arrays[reelIdx][finalIdx]);

    document.getElementById('reel-box-' + reelIdx).className = 'reel-box locked';

    activePos++;
    if (activePos < activeSteps.length) {
      document.getElementById('reel-box-' + activeSteps[activePos]).className = 'reel-box active';
    } else {
      finishSlot();
    }
  }

  function finishSlot() {
    isSpinning = false;
    document.getElementById('start-btn').disabled = false;
    document.getElementById('stop-btn').disabled = true;

    var currentVerbs = buildVerbs(currentLevel);
    var subj = subjects[selectedIndices[0]] || subjects[0];
    var time = timeMeans[selectedIndices[1]] || timeMeans[0];
    var target = targets[selectedIndices[2]] || targets[0];
    var verb = currentVerbs[selectedIndices[3]] || currentVerbs[0];

    var particle = "";
    if (target.particleOverride) {
      particle = target.particleOverride;
    } else {
      var lastChar = target.kr.charCodeAt(target.kr.length - 1);
      var hasBatchim = (lastChar >= 0xac00 && lastChar <= 0xd7a3) ? ((lastChar - 0xac00) % 28 !== 0) : false;
      particle = hasBatchim ? "을" : "를";
    }

    document.getElementById('final-kr-text').textContent = subj.kr + " " + time.kr + " " + target.kr + particle + " " + verb.pattern + ".";
    var finalJp = document.getElementById('final-jp-text');
    finalJp.textContent = subj.jp + " " + time.jp + " " + target.jp + "を " + verb.jpPattern + "。";

    var revealBtn = document.getElementById('reveal-btn');
    if (hideJp) {
      finalJp.classList.add('hidden');
      revealBtn.style.display = 'inline-block';
    } else {
      finalJp.classList.remove('hidden');
      revealBtn.style.display = 'none';
    }

    document.getElementById('grammar-note').textContent = "💡 文法解説: " + verb.note;
    document.getElementById('result-card').style.display = 'flex';

    if (autoTts) speakSentence();
  }

  function revealAnswer() {
    document.getElementById('final-jp-text').classList.remove('hidden');
    document.getElementById('reveal-btn').style.display = 'none';
  }

  function setLevel(lvl) {
    if (isSpinning) return;
    currentLevel = lvl;
    document.getElementById('btn-topik3').className = lvl === 'topik3' ? 'level-btn active' : 'level-btn';
    document.getElementById('btn-topik4').className = lvl === 'topik4' ? 'level-btn active' : 'level-btn';
    var currentVerbs = buildVerbs(currentLevel);
    updateReelDisplay(3, currentVerbs[selectedIndices[3]] || currentVerbs[0]);
  }

  function togglePin(idx) {
    if (isSpinning) return;
    pinned[idx] = !pinned[idx];
    var btn = document.getElementById('pin-' + idx);
    var box = document.getElementById('reel-box-' + idx);
    if (pinned[idx]) {
      btn.textContent = "🔒 固定中";
      btn.classList.add('pinned');
      box.className = 'reel-box pinned';
    } else {
      btn.textContent = "🔓 固定";
      btn.classList.remove('pinned');
      box.className = 'reel-box';
    }
  }

  function speakSentence() {
    var text = document.getElementById('final-kr-text').textContent;
    if ('speechSynthesis' in window && text) {
      window.speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  // イベント登録
  document.getElementById('start-btn').addEventListener('click', startSlot);
  document.getElementById('stop-btn').addEventListener('click', stopNextReel);
  document.getElementById('btn-topik3').addEventListener('click', function() { setLevel('topik3'); });
  document.getElementById('btn-topik4').addEventListener('click', function() { setLevel('topik4'); });
  document.getElementById('audio-btn').addEventListener('click', speakSentence);
  document.getElementById('reveal-btn').addEventListener('click', revealAnswer);

  document.getElementById('btn-hide-jp').addEventListener('click', function() {
    hideJp = !hideJp;
    this.textContent = hideJp ? "🙈 和訳隠し: ON" : "🙈 和訳隠し: OFF";
    this.classList.toggle('active', hideJp);
    applyHideJpState();
  });

  document.getElementById('btn-auto-tts').addEventListener('click', function() {
    autoTts = !autoTts;
    this.textContent = autoTts ? "🔊 自動音声: ON" : "🔊 自動音声: OFF";
    this.classList.toggle('active', autoTts);
  });

  for (var p = 0; p < 4; p++) {
    (function(idx) {
      document.getElementById('pin-' + idx).addEventListener('click', function() {
        togglePin(idx);
      });
    })(p);
  }

  window.addEventListener('keydown', function(e) {
    if (e.code === 'KeyA' || (e.key && (e.key.toLowerCase() === 'a' || e.key === 'ㅁ'))) {
      if (!isSpinning) startSlot();
    } else if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (isSpinning) stopNextReel();
    } else if (e.code === 'KeyH') {
      if (document.getElementById('reveal-btn').style.display !== 'none') {
        revealAnswer();
      }
    }
  });
})();
</script>
</body>
</html>
